name: AgentShelf quality checks
on:
  pull_request:
  push:
    branches: [main, codex/agentshelf]
permissions:
  contents: read
concurrency:
  group: agentshelf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npx --yes npm@11.6.2 ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      # Hosted deployment stays with the existing Vercel Git integration.
      # No production keys or pulled environment files enter this workflow.
